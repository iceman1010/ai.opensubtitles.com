<section class="page-head">
	<h1>{{ @job.new_h1 }}</h1>
	<p class="lead">{{ @job.new_lead }}</p>
</section>
<section class="upload-zone">
	<div id="dropzone" class="dropzone">
		<p>{{ @job.drop_hint }}</p>
		<input type="file" id="file-input" hidden>
	</div>
	<div id="detect-result" class="detect-result" hidden></div>
	<div id="file-details" class="file-details" hidden>
		<button id="file-details-toggle" class="file-details-toggle" type="button" aria-expanded="false" aria-controls="file-details-body">
			<svg class="btn-icon" aria-hidden="true"><use href="#icon-chevron-down"/></svg>
			<span class="btn-label">{{ @job.file_details }}</span>
		</button>
		<div id="file-details-body" class="file-details-body" hidden></div>
	</div>
	<div id="lang-detect" class="lang-detect" hidden></div>

	<div id="options-panel" hidden>
		<div id="transcribe-options" hidden>
			<h2>{{ @job.transcription_options }}</h2>
			<label>{{ @job.model }}<select name="model"></select></label>
			<label>{{ @job.language }}<select data-role="language"></select></label>
		</div>
		<div id="translate-options" hidden>
			<h2>{{ @job.translation_options }}</h2>
			<label>{{ @job.model }}<select name="model"></select></label>
			<label>{{ @job.from }}<select data-role="language"></select></label>
			<label>{{ @job.to }}<select data-role="language"></select></label>
		</div>
		<button id="job-submit" class="btn btn-primary" type="button"><svg class="btn-icon" aria-hidden="true"><use href="#icon-upload"/></svg><span class="btn-label">{{ @job.submit }}</span></button>
	</div>

	<div id="convert-progress" hidden>
		<p>{{ @job.converting }}</p>
		<progress id="convert-bar" max="100" value="0"></progress>
	</div>
	<div id="upload-progress" hidden>
		<p>{{ @job.uploading }}</p>
		<progress id="upload-bar" max="100" value="0"></progress>
	</div>
	<p id="job-error" class="form-error" hidden></p>

	<div id="detect-modal" class="modal-overlay" hidden>
		<div class="modal-login-card" role="dialog" aria-modal="true" aria-labelledby="detect-modal-title">
			<p id="detect-modal-title" class="modal-title">{{ @job.detect_consent_title }}</p>
			<p class="muted">{{ @job.detect_consent_text }}</p>
			<div class="modal-actions">
				<button class="btn btn-primary" type="button" id="detect-modal-yes"><svg class="btn-icon" aria-hidden="true"><use href="#icon-mic"/></svg><span class="btn-label">{{ @job.detect_consent_yes }}</span></button>
				<button class="btn" type="button" id="detect-modal-no"><span class="btn-label">{{ @job.detect_consent_no }}</span></button>
			</div>
		</div>
	</div>
	<div id="newjob-i18n" hidden
		data-detecting_language="{{ @job.detecting_language }}"
		data-language_detected="{{ @job.language_detected }}"
		data-language_detect_failed="{{ @job.language_detect_failed }}"
		data-select_language="{{ @job.select_language }}"
		data-details_container="{{ @job.details_container }}"
		data-details_video="{{ @job.details_video }}"
		data-details_audio="{{ @job.details_audio }}"
		data-details_format="{{ @job.details_format }}"
		data-details_duration="{{ @job.details_duration }}"
		data-details_size="{{ @job.details_size }}"
		data-details_bitrate="{{ @job.details_bitrate }}"
		data-details_resolution="{{ @job.details_resolution }}"
		data-details_frame_rate="{{ @job.details_frame_rate }}"
		data-details_channels="{{ @job.details_channels }}"
		data-details_sample_rate="{{ @job.details_sample_rate }}"
		data-details_language="{{ @job.details_language }}"
		data-details_subtitles="{{ @job.details_subtitles }}"
		data-details_captions="{{ @job.details_captions }}"
		data-details_characters="{{ @job.details_characters }}"
		data-details_words="{{ @job.details_words }}"
		data-details_avg_length="{{ @job.details_avg_length }}"
		data-detect_skipped="{{ @job.detect_skipped }}"
	></div>
</section>
<script src="/js/detect.js"></script>
<script type="module" src="/js/subsrt-global.js"></script>
<script src="/js/ffmpeg-service.js"></script>
<script src="/js/media-info-service.js"></script>
<script src="/js/new-job.js"></script>
