<section class="page-head">
	<h1>{{ @dashboard.h1 }}</h1>
</section>
<section class="dashboard-grid">
	<div class="card"><h2>{{ @dashboard.credits }}</h2><p id="credits-value" class="big-number">–</p><a class="btn btn-primary" href="/buy"><svg class="btn-icon" aria-hidden="true"><use href="#icon-coin"/></svg><span class="btn-label">{{ @dashboard.buy_cta }}</span></a></div>
	<div class="card"><h2>{{ @dashboard.new_job }}</h2><a class="btn btn-primary" href="/new"><svg class="btn-icon" aria-hidden="true"><use href="#icon-upload"/></svg><span class="btn-label">{{ @dashboard.new_job_cta }}</span></a></div>
</section>
<section class="dash-cols">
	<section class="card">
		<h2>{{ @dashboard.recent }}</h2>
		<div id="recent-activities"><p class="empty">…</p></div>
	</section>
	<section class="card">
		<h2>{{ @dashboard.media }}</h2>
		<div id="recent-media"><p class="empty">…</p></div>
	</section>
</section>
<section class="card payments-card">
	<h2>{{ @dashboard.payments }}</h2>
	<div id="payment-history"><p class="empty">…</p></div>
</section>
<div id="dash-i18n" hidden
	data-files="{{ @media.files }}"
	data-preview="{{ @media.preview }}"
	data-download="{{ @media.download }}"
	data-close="{{ @media.close }}"
	data-font_smaller="{{ @media.font_smaller }}"
	data-font_larger="{{ @media.font_larger }}"
	data-find_placeholder="{{ @media.find_placeholder }}"
	data-find="{{ @media.find }}"
	data-cues="{{ @media.cues }}"
	data-prev_match="{{ @media.prev_match }}"
	data-next_match="{{ @media.next_match }}"
	data-media_none="{{ @media.none }}"
	data-media_error="{{ @media.error }}"
	data-activities_none="{{ @activities.none }}"
	data-activities_error="{{ @activities.error }}"
	data-payments_none="{{ @payments.none }}"
	data-payments_error="{{ @payments.error }}"
	data-payments_date="{{ @payments.date }}"
	data-payments_usd="{{ @payments.usd }}"
	data-payments_credits="{{ @payments.credits }}"
	data-activities_type="{{ @activities.type }}"
	data-activities_credits="{{ @activities.credits }}"
	data-activities_date="{{ @activities.date }}"
	data-media_head="{{ @media.head }}"
	data-media_date="{{ @media.date }}"
	data-download_failed="{{ @media.download_failed }}"
	data-preview_failed="{{ @media.preview_failed }}"
	data-show_more="{{ @dashboard.show_more }}"
	data-more_error="{{ @dashboard.more_error }}"
></div>
<script type="module" src="/js/subsrt-global.js"></script>
<script src="/js/subtitle-viewer.js"></script>
<script src="/js/preview-modal.js"></script>
<script src="/js/dashboard.js"></script>
