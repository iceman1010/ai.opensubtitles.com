<section class="page-head">
	<h1>{{ @tools.h1 }}</h1>
	<p class="lead">{{ @tools.lead }}</p>
</section>
<check if="{{ @tools_error }}">
	<true>
		<p class="muted">{{ @tools.error | esc }}</p>
	</true>
	<false>
		<nav class="tools-nav" aria-label="{{ @tools.h1 | esc }}">
			<repeat group="{{ @tools_sections }}" value="{{ @section }}">
				<a class="btn btn-small btn-ghost" href="#cat-{{ @section.id | esc }}">{{ @section.label | esc }}</a>
			</repeat>
		</nav>
		<repeat group="{{ @tools_sections }}" value="{{ @section }}">
			<section class="tools-section" id="cat-{{ @section.id | esc }}">
				<h2>{{ @section.label | esc }}</h2>
				<div class="packages">
					<repeat group="{{ @section.tools }}" value="{{ @tool }}">
						<article class="package-card">
							<h3><a href="/tools/{{ @tool.slug | esc }}">{{ @tool.name | esc }}</a></h3>
							<check if="{{ @tool.badge }}">
								<span class="tool-badge">{{ @tool.badge | esc }}</span>
							</check>
							<p class="muted svc-desc">{{ @tool.desc | esc }}</p>
							<div class="tool-links">
								<check if="{{ @tool.website }}">
									<a class="btn btn-small btn-ghost" href="{{ @tool.website | esc }}" target="_blank" rel="noopener noreferrer">{{ @tools.btn_website | esc }}</a>
								</check>
								<check if="{{ @tool.github }}">
									<a class="btn btn-ghost btn-small" href="{{ @tool.github | esc }}" target="_blank" rel="noopener noreferrer">{{ @tools.btn_github | esc }}</a>
								</check>
							</div>
						</article>
					</repeat>
				</div>
			</section>
		</repeat>
	</false>
</check>
