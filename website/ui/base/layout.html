<!DOCTYPE html>
<html lang="{{ @locale }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ @page_title }} · {{ @site_name }}</title>
	<meta name="description" content="{{ @page_description }}">
	<meta name="api-base" content="{{ @APP.api_base }}">
	<meta name="api-key" content="{{ @APP.api_key }}">
	<meta name="api-user-agent" content="{{ @APP.user_agent }}">
	<link rel="canonical" href="https://ai.opensubtitles.com{{ @canonical }}">
	<check if="{{ @noindex }}"><true><meta name="robots" content="noindex, nofollow"></true></check>
	<repeat group="{{ @alternates }}" key="{{ @hl }}" value="{{ @url }}"><link rel="alternate" hreflang="{{ @hl }}" href="https://ai.opensubtitles.com{{ @url }}">
	</repeat>
	<link rel="stylesheet" href="/assets/css/caption-light/tokens.css">
	<link rel="stylesheet" href="/assets/css/caption-light/main.css">
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
	<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
	<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
	<script src="/js/config.js"></script>
	<script src="/js/api.js"></script>
	<script src="/js/auth.js"></script>
</head>
<body>
	<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
		<symbol id="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></symbol>
		<symbol id="icon-languages" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></symbol>
		<symbol id="icon-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></symbol>
		<symbol id="icon-log-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></symbol>
		<symbol id="icon-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></symbol>
		<symbol id="icon-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
		<symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 17 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
		<symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
		<symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
		<symbol id="icon-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></symbol>
		<symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
		<symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
		<symbol id="icon-coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="18"/><path d="M14.7 8.2H10.6a1.9 1.9 0 0 0 0 3.8h2.7a1.9 1.9 0 0 1 0 3.8H8.7"/></symbol>
		<symbol id="icon-tool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
		<symbol id="icon-more" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></symbol>
	</svg>
	<header class="site-header">
		<a class="brand" href="/"><img src="/assets/img/logo-64.png" alt="{{ @site_name }}" width="32" height="32"></a>
		<nav>
			<a class="nav-pill" href="/transcribe"><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-mic"/></svg></span><span class="btn-label">{{ @nav.transcribe }}</span></a>
			<a class="nav-pill" href="/translate"><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-languages"/></svg></span><span class="btn-label">{{ @nav.translate }}</span></a>
			<a class="nav-pill" href="/search"><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-search"/></svg></span><span class="btn-label">{{ @nav.search }}</span></a>
			<div class="nav-more">
				<button class="nav-pill" id="nav-more-btn" type="button" aria-haspopup="true" aria-expanded="false"><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-more"/></svg></span><span class="btn-label">{{ @nav.more }}</span></button>
				<div class="nav-menu" id="nav-menu">
					<a class="nav-pill" href="/pricing"><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-tag"/></svg></span><span class="btn-label">{{ @nav.pricing }}</span></a>
					<a class="nav-pill" href="/tools"><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-tool"/></svg></span><span class="btn-label">{{ @nav.tools }}</span></a>
					<a class="nav-pill" href="/dashboard" data-auth="in" hidden><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-dashboard"/></svg></span><span class="btn-label">{{ @nav.dashboard }}</span></a>
				</div>
			</div>
			<a class="nav-pill" href="/login" id="nav-login" data-auth="out"><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-log-in"/></svg></span><span class="btn-label">{{ @nav.login }}</span></a>
			<button class="nav-pill" id="nav-logout" type="button" data-auth="in" hidden><span class="nav-icon"><svg class="btn-icon" aria-hidden="true"><use href="#icon-log-out"/></svg></span><span class="btn-label">{{ @nav.logout }}</span></button>
			<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
		</nav>
	</header>
	<script>
		(function () {
			var t = localStorage.getItem('ai_opensubtitles_token');
			var e = Number(localStorage.getItem('ai_opensubtitles_token_expiry'));
			var on = !!(t && e > Date.now());
			document.querySelectorAll('[data-auth]').forEach(function (el) {
				el.hidden = el.getAttribute('data-auth') === 'in' ? !on : on;
			});
		})();
	</script>
	<main>
		<include href="{{ @page }}">
	</main>
	<footer class="site-footer">
		<p>© {{ date('Y') }} {{ @site_name }} · <a href="https://www.opensubtitles.com">{{ @footer.main_site }}</a></p>
	</footer>
	<script src="/js/theme-toggle.js"></script>
	<script src="/js/nav-menu.js"></script>
</body>
</html>
