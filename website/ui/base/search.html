<section class="page-head">
	<h1>{{ @search.h1 }}</h1>
	<p class="lead">{{ @search.lead }}</p>
</section>
<section class="search-page">
	<div class="card search-card">
		<div class="seg" role="tablist">
			<button id="tab-subtitles" class="seg-btn" type="button" role="tab" aria-selected="true">{{ @search.tab_subtitles }}</button>
			<button id="tab-features" class="seg-btn" type="button" role="tab" aria-selected="false">{{ @search.tab_features }}</button>
		</div>
		<form id="search-form">
			<div class="search-row">
				<input type="search" id="search-query" placeholder="{{ @search.placeholder_subtitles }}" autocomplete="off">
				<button id="search-submit" class="btn btn-primary" type="submit"><svg class="btn-icon" aria-hidden="true"><use href="#icon-search"/></svg><span class="btn-label">{{ @search.submit }}</span></button>
			</div>
			<div class="search-filters">
				<label>{{ @search.language }}<select id="search-language"></select></label>
				<label>{{ @search.type }}<select id="search-type">
					<option value="">{{ @search.type_all }}</option>
					<option value="movie">{{ @search.type_movie }}</option>
					<option value="episode">{{ @search.type_episode }}</option>
				</select></label>
				<button id="search-advanced-toggle" class="link-btn" type="button">{{ @search.advanced }} ▾</button>
			</div>
			<div id="search-advanced" class="search-advanced" hidden>
				<label>{{ @search.imdb_id }}<input type="text" id="search-imdb" placeholder="tt0133093" autocomplete="off"></label>
				<label>{{ @search.year }}<input type="number" id="search-year" min="1900" max="2100" inputmode="numeric"></label>
			</div>
		</form>
		<p id="search-error" class="form-error" hidden></p>
	</div>

	<div id="search-results" hidden>
		<div class="results-head">
			<h2 id="results-title"></h2>
			<span id="results-meta"></span>
		</div>
		<div id="results-grid" class="results-grid"></div>
		<div class="pagination" id="pagination" hidden>
			<button id="page-prev" class="btn btn-ghost btn-small" type="button">← {{ @search.prev }}</button>
			<span id="page-info"></span>
			<button id="page-next" class="btn btn-ghost btn-small" type="button">{{ @search.next }} →</button>
		</div>
	</div>
</section>

<check if="{{ @search_content }}">
	<section class="search-content">
		<include href="{{ @search_content }}">
	</section>
</check>

<div id="lightbox-overlay" class="lightbox-overlay" hidden>
	<img id="lightbox-img" alt="">
</div>

<div id="search-i18n" hidden
	data-results_for="{{ @search.results_for }}"
	data-results_title_subtitles="{{ @search.results_title_subtitles }}"
	data-results_title_features="{{ @search.results_title_features }}"
	data-found="{{ @search.found }}"
	data-page_of="{{ @search.page_of }}"
	data-of="{{ @search.of }}"
	data-empty="{{ @search.empty }}"
	data-error="{{ @search.error }}"
	data-find_subtitles="{{ @search.find_subtitles }}"
	data-episodes_count="{{ @search.episodes_count }}"
	data-subtitles_count="{{ @search.subtitles_count }}"
	data-preview="{{ @search.preview }}"
	data-download="{{ @search.download }}"
	data-close="{{ @search.close }}"
	data-font_smaller="{{ @search.font_smaller }}"
	data-font_larger="{{ @search.font_larger }}"
	data-find_placeholder="{{ @search.find_placeholder }}"
	data-find="{{ @search.find }}"
	data-cues="{{ @search.cues }}"
	data-prev_match="{{ @search.prev_match }}"
	data-next_match="{{ @search.next_match }}"
	data-downloading="{{ @search.downloading }}"
	data-loading_preview="{{ @search.loading_preview }}"
	data-login_required="{{ @search.login_required }}"
	data-download_failed="{{ @search.download_failed }}"
	data-release="{{ @search.release }}"
	data-downloads="{{ @search.downloads }}"
	data-uploaded="{{ @search.uploaded }}"
	data-by="{{ @search.by }}"
	data-on_demand="{{ @search.on_demand }}"
	data-hearing_impaired="{{ @search.hearing_impaired }}"
	data-ai_translated="{{ @search.ai_translated }}"
	data-foreign_parts="{{ @search.foreign_parts }}"
	data-trusted="{{ @search.trusted }}"
	data-on_demand_uploader="AI.OpenSubtitles.com"
></div>

<script type="module" src="/js/subsrt-global.js"></script>
<script src="/js/subtitle-viewer.js"></script>
<script src="/js/preview-modal.js"></script>
<script src="/js/search-page.js"></script>
