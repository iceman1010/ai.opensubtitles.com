<h2>字幕検索</h2>
<p>数十言語に対応した映画・ドラマの字幕を検索できます。既存字幕のダウンロードにはログインが必要です。選択した言語の字幕が見つからない場合は、AIによる字幕生成（自動翻訳＋品質チェック）をオンデマンドで行えます。クレジットを消費することで、完全なSRT字幕ファイルを取得できます。</p>
<h2>結果を再アップロードせずに翻訳</h2><p>結果の各字幕には「字幕翻訳」ボタンが付いています。ワンクリックでそのファイルがそのままAI翻訳に渡されます。ダウンロードも、別のアップロードも不要です。ジョブページで翻訳先の言語を選ぶと、完成したSRTまたはVTTファイルが戻ってきます。翻訳は有料サービスです。</p>
