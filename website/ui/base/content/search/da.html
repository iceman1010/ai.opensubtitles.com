<h2>Søg undertekster</h2>
<p>Søg undertekster til film og serier på ti-tal sprog. For download af eksisterende undertekster kræves login. Hvis undertekster på ønsket sprog mangler, kan disse oprettes på anmodning med AI (automatisk oversættelse + kvalitetskontrol). For at få den fulde SRT-fil bruges krediter.</p>
