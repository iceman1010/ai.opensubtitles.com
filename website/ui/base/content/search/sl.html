<h2>Iskanje podnapisov</h2>
<p>Iščite podnapise za filme in serije v več deset jezikov. Prenos obstoječih podnapisov zahteva prijavo. Če ni podnapisov v želenem jeziku, jih je mogoče ustvariti na zahtevo z AI (samodejni prevod + preverjanje kakovosti). Za pridobitev celotne datoteke SRT so potrebni krediti.</p>
